name: Microblog CI

on:
  push:
    branches:
      - '**'
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Run Docker Tests
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Build and run Tests
      run: docker compose run --build --rm test
