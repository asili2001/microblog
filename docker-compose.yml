services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile_prod
      args:
        APP_VERSION: ${APP_VERSION:-unknown}

    image: ${DOCKERHUB_USERNAME}/microblog:${APP_VERSION}
    
    ports:
      - "8000:5000"

    restart: unless-stopped

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile_test
      args:
        APP_VERSION: ${APP_VERSION:-unknown}

    volumes:
      - ./app:/home/microblog/app:ro
      - ./tests:/home/microblog/tests:ro
